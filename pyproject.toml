[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neoctl"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "click>=8.1",
    "paramiko>=3.4",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
neoctl = "neoctl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neoctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
