# Neobanker DEV environment — all stateful services
# Usage:
#   cd <workspace-root>/repos/neobanker-backend-MVP-V2/dev
#   docker compose -f docker-compose.dev.yml up -d
#
# This file replaces the legacy docker-compose.yml at the backend repo root,
# which was not being maintained and used incompatible image versions.
#
# Versions are chosen to MATCH or be compatible with the deploy environment:
#   - MySQL 8.0       — same as backend deploy.yml CI service
#   - ES 7.17.20      — backend ES client is 8.11.1, requires 7.17+ for X-Elastic-Product header
#   - Redis 7-alpine  — small, drop-in for application.properties spring.data.redis.*
#   - MinIO 2024      — only needed if you use file uploads
#
# Application processes (backend Spring Boot, agent FastAPI, frontend Next.js)
# are intentionally NOT in this file — they are too heavy to rebuild each time
# and are run by `bootstrap.sh` directly using mvnw / uv / npm.

services:

  mysql:
    image: mysql:8.0
    container_name: neobanker-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"      # host:container — backend application.properties uses 3307
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: neobanker
      MYSQL_USER: neobanker_backend
      MYSQL_PASSWORD: neobanker_backend_password
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - neobanker

  redis:
    image: redis:7-alpine
    container_name: neobanker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - neobanker

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.20
    container_name: neobanker-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - neobanker

  # Optional — only required for file upload features. Skip if you don't use them.
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: neobanker-minio
    restart: unless-stopped
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neobanker
    profiles: ["full"]   # only started when `--profile full`

  # Optional — phpMyAdmin web UI for MySQL inspection
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: neobanker-phpmyadmin
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - neobanker
    profiles: ["full"]

volumes:
  mysql-data:
  redis-data:
  es-data:
  minio-data:

networks:
  neobanker:
    driver: bridge
