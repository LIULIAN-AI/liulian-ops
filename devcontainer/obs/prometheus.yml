global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'liulian-api'
    static_configs:
      - targets: ['workspace:8000']
    metrics_path: /metrics

  - job_name: 'liulian-agent'
    static_configs:
      - targets: ['workspace:8001']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
