name: Lint (Linux/macOS/Windows)

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint shell + compose
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          for f in scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: Bash syntax check (Windows via git-bash)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          for f in scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: ShellCheck (Linux only — installs cleanly)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/bootstrap.sh scripts/teardown.sh || true

      - name: docker compose config validation (Linux only — GHA macOS/Windows runners lack docker daemon)
        if: matrix.os == 'ubuntu-latest'
        run: docker compose -f docker/docker-compose.yml config -q

      - name: Verify env templates parse
        shell: bash
        run: |
          for f in templates/env/*.env.example; do
            echo "--- $f ---"
            # Verify each non-comment line is KEY=VALUE form
            grep -v "^[[:space:]]*#" "$f" | grep -v "^[[:space:]]*$" \
              | grep -E '^[A-Z_][A-Z0-9_]*=' >/dev/null \
              || { echo "Invalid env line in $f"; exit 1; }
          done
          echo "All env templates OK"
